name: agent

# Builder/reviewer agent pipeline. All logic lives in __PIPELINE_REPO__;
# this file only decides WHEN to run it. Project settings: .agent-pipeline.yml

on:
  issues:
    types: [labeled]                  # add the "agent:build" label to an issue to start the builder
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]   # every human PR gets an agent review
  workflow_dispatch:                  # used by the pipeline itself to chain build -> review -> fix
    inputs:
      mode:
        type: choice
        options: [review, fix]
        default: review
      pr_number:
        type: number
        required: true
      feedback_run_id:
        type: string
        default: ""

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write
  statuses: write
  id-token: write

concurrency:
  group: agent-${{ github.event.pull_request.number || inputs.pr_number || github.event.issue.number }}
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name == 'issues' && github.event.label.name == 'agent:build'
    uses: __PIPELINE_REPO__/.github/workflows/agent-build.yml@__PIPELINE_REF__
    with:
      mode: build
      issue_number: ${{ github.event.issue.number }}
      pipeline_repo: __PIPELINE_REPO__
      pipeline_ref: __PIPELINE_REF__
    secrets: inherit

  fix:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'fix'
    uses: __PIPELINE_REPO__/.github/workflows/agent-build.yml@__PIPELINE_REF__
    with:
      mode: fix
      # workflow_dispatch hands inputs over as strings; the reusable workflow wants a number
      pr_number: ${{ fromJSON(format('{0}', inputs.pr_number)) }}
      feedback_run_id: ${{ inputs.feedback_run_id }}
      pipeline_repo: __PIPELINE_REPO__
      pipeline_ref: __PIPELINE_REF__
    secrets: inherit

  review:
    if: >-
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        && github.event.pull_request.user.login != 'github-actions[bot]')
      || (github.event_name == 'workflow_dispatch' && inputs.mode == 'review')
    uses: __PIPELINE_REPO__/.github/workflows/agent-review.yml@__PIPELINE_REF__
    with:
      pr_number: ${{ fromJSON(format('{0}', github.event.pull_request.number || inputs.pr_number)) }}
      pipeline_repo: __PIPELINE_REPO__
      pipeline_ref: __PIPELINE_REF__
    secrets: inherit
