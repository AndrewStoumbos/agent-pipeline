# .agent-pipeline.yml — settings for the builder/reviewer agent pipeline
language: java
version: "21"
setup: ""

gates:
  - name: build-and-test
    run: ./gradlew build --no-daemon      # or: mvn -B verify

security:
  semgrep: true
  gitleaks: true

models:
  builder: claude-opus-5-5
  reviewer: claude-fable-5-1

builder:
  max_turns: 60
  allowed_commands:
    - "./gradlew:*"
    - "mvn:*"

review:
  max_turns: 30
  max_rounds: 3
  block_on: [blocker, major]
  auto_fix: agent_prs
  ignore_paths: []
  focus: ""
