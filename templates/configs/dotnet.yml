# .agent-pipeline.yml — settings for the builder/reviewer agent pipeline
language: dotnet
version: "8.0.x"
setup: |
  dotnet restore

gates:
  - name: format
    run: dotnet format --verify-no-changes
  - name: build
    run: dotnet build --no-restore -warnaserror
  - name: tests
    run: dotnet test --no-build

security:
  semgrep: true
  gitleaks: true

models:
  builder: claude-opus-5-5
  reviewer: claude-fable-5-1

builder:
  max_turns: 60
  allowed_commands:
    - "dotnet build:*"
    - "dotnet test:*"
    - "dotnet format:*"

review:
  max_turns: 30
  max_rounds: 3
  block_on: [blocker, major]
  auto_fix: agent_prs
  ignore_paths: []
  focus: ""
