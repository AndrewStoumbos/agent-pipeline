name: Setup toolchain
description: Install the language toolchain named in .agent-pipeline.yml, then run the project's setup command.
inputs:
  language:
    description: python | node | go | rust | java | dotnet | none
    required: true
  version:
    description: Toolchain version (blank = a sensible default)
    required: false
    default: ""
  setup:
    description: Shell command that installs project dependencies
    required: false
    default: ""
runs:
  using: composite
  steps:
    - if: inputs.language == 'python'
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.version || '3.12' }}

    - if: inputs.language == 'node'
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.version || '20' }}

    - if: inputs.language == 'go'
      uses: actions/setup-go@v5
      with:
        go-version: ${{ inputs.version || 'stable' }}

    - if: inputs.language == 'java'
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: ${{ inputs.version || '21' }}

    - if: inputs.language == 'rust'
      shell: bash
      env:
        RUST_VERSION: ${{ inputs.version || 'stable' }}
      run: |
        rustup toolchain install "$RUST_VERSION" --profile minimal --component clippy,rustfmt
        rustup default "$RUST_VERSION"

    - if: inputs.language == 'dotnet'
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ inputs.version || '8.0.x' }}

    - if: inputs.setup != ''
      name: Project setup
      shell: bash
      env:
        SETUP_CMD: ${{ inputs.setup }}
      run: bash -o pipefail -c "$SETUP_CMD"
