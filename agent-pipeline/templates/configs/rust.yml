# .agent-pipeline.yml — settings for the builder/reviewer agent pipeline
language: rust
version: "stable"
setup: ""

gates:
  - name: format
    run: cargo fmt --all -- --check
  - name: clippy
    run: cargo clippy --all-targets -- -D warnings
  - name: tests
    run: cargo test --all

security:
  semgrep: true
  gitleaks: true

models:
  builder: claude-opus-5-5
  reviewer: claude-fable-5-1

builder:
  max_turns: 60
  allowed_commands:
    - "cargo build:*"
    - "cargo test:*"
    - "cargo fmt:*"
    - "cargo clippy:*"

review:
  max_turns: 30
  max_rounds: 3
  block_on: [blocker, major]
  auto_fix: agent_prs
  ignore_paths: ["Cargo.lock"]
  focus: ""
